[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-workflow-showcase"
version = "0.1.0"
description = "Offline regulatory workflow demonstrations using invented examples."
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1.2,<2"]

[project.scripts]
report-demo = "demos.report_composer:main"

[tool.setuptools.packages.find]
include = ["demos*"]

[tool.pyright]
include = ["demos", "tests"]
typeCheckingMode = "standard"
