name: Synthetic demo tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  report-composer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install demonstration
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic package
        run: python -m demos.report_composer --input fixtures/reporting/annual-report.json --output output/report-demo --confirm-synthetic
