name: Synthetic demo tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-demos:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install demonstration
        run: python -m pip install ".[monitor]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic package
        run: python -m demos.report_composer --input fixtures/reporting/annual-report.json --output output/report-demo --confirm-synthetic
      - name: Generate invented spreadsheets
        run: python -m demos.monitor_fixtures --output output/monitor-inputs
      - name: Monitor first observation
        run: python -m demos.reference_monitor --feed fixtures/monitoring/feed.xml --spreadsheet output/monitor-inputs/baseline.xlsx --interests fixtures/monitoring/interests.json --output output/monitor-first --confirm-synthetic
      - name: Monitor identical repeat
        run: python -m demos.reference_monitor --feed fixtures/monitoring/feed.xml --spreadsheet output/monitor-inputs/baseline.xlsx --interests fixtures/monitoring/interests.json --previous output/monitor-first/state.json --output output/monitor-repeat --confirm-synthetic
      - name: Monitor revised record
        run: python -m demos.reference_monitor --feed fixtures/monitoring/feed.xml --spreadsheet output/monitor-inputs/revised.xlsx --interests fixtures/monitoring/interests.json --previous output/monitor-repeat/state.json --output output/monitor-revised --confirm-synthetic
